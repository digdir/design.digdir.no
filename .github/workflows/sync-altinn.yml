name: Synkroniser Altinn-komponenter

# Henter komponentlister og skjermbilder fra Altinn-repoene og lager en PR
# når noe har endret seg. Se apps/www/scripts/altinn-sync/sync.mjs.

on:
  workflow_dispatch:
  schedule:
    # Hver mandag kl. 06.17 UTC
    - cron: '17 6 * * 1'

concurrency:
  group: sync-altinn
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout design.digdir.no
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/gh-setup

      - name: Checkout altinn-components
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Altinn/altinn-components.git "$RUNNER_TEMP/altinn-components"
          git -C "$RUNNER_TEMP/altinn-components" sparse-checkout set --no-cone /lib/components/
          echo "AC_SHA=$(git -C "$RUNNER_TEMP/altinn-components" rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Checkout altinn-studio
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Altinn/altinn-studio.git "$RUNNER_TEMP/altinn-studio"
          git -C "$RUNNER_TEMP/altinn-studio" sparse-checkout set --no-cone \
            /package.json /yarn.lock /.yarnrc.yml /.yarn/ \
            /src/Designer/frontend/ /src/Designer/development/azure-devops-mock/ \
            /src/common/ /src/App/frontend/
          echo "AS_SHA=$(git -C "$RUNNER_TEMP/altinn-studio" rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Bygg Storybook for Studio- og skjemakomponentene
        working-directory: ${{ runner.temp }}/altinn-studio
        run: |
          node .yarn/releases/yarn-*.cjs install --mode=skip-build
          (cd src/Designer/frontend/libs/designer-components && npx storybook build -o "$RUNNER_TEMP/sb-studio" --quiet)
          (cd src/common/ts/form-component && npx storybook build -o "$RUNNER_TEMP/sb-form" --quiet)

      - name: Installer Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: Synkroniser
        working-directory: apps/www
        env:
          AC_REPO: ${{ runner.temp }}/altinn-components
          AS_REPO: ${{ runner.temp }}/altinn-studio
          SB_STUDIO: ${{ runner.temp }}/sb-studio
          SB_FORM: ${{ runner.temp }}/sb-form
          PLAYWRIGHT_DIR: ${{ runner.temp }}/pw
          SUMMARY_FILE: ${{ runner.temp }}/summary.md
        run: |
          node scripts/altinn-sync/sync.mjs
          {
            echo ""
            echo "Kilder: Altinn/altinn-components@${AC_SHA}, Altinn/altinn-studio@${AS_SHA}."
            echo ""
            echo "Komponenter som er nye, havner i gruppen «Nye komponenter». Flytt dem til riktig gruppe i \`apps/www/scripts/altinn-sync/groups.json\` før PR-en flettes."
          } >> "$RUNNER_TEMP/summary.md"

      - name: Lint
        run: pnpm lint

      - name: Lag PR
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          branch: chore/sync-altinn-komponenter
          delete-branch: true
          commit-message: 'chore(altinn): synkroniser komponenter og skjermbilder'
          title: 'chore(altinn): synkroniser komponenter og skjermbilder'
          body-path: ${{ runner.temp }}/summary.md
          add-paths: |
            apps/www/app/content/altinn/*.mdx
            apps/www/public/images/altinn/**
            apps/www/public/altinn-snapshots/**
